<script type="text/babel">
// Auto-clear all browser caches and service workers on new version load
(function(){
  try{if('caches' in window){caches.keys().then(function(ns){ns.forEach(function(n){caches.delete(n);});});}}catch(e){}
  try{if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){r.unregister();});});}}catch(e){}
})();
const {useState,useEffect,useRef,useCallback,useMemo}=React;
const API="http://localhost:8765";
const WS_BASE="ws://localhost:8765";
const MODELS=["claude","gemini","kimi"];
const ALL_TABS=["claude","gemini","kimi","web"];
const CLR={claude:"#e09d55",gemini:"#b88de8",kimi:"#5ab8ff",web:"#f0c040"};
const CLR_RGB={
  claude:{r:224,g:157,b:85},
  gemini:{r:184,g:141,b:232},
  kimi:{r:90,g:184,b:255},
};
const BRIDGE_THRESHOLD=10;

function fmtSecs(s){
  s=Math.floor(s||0);if(s<=0)return"now";
  const d=Math.floor(s/86400),h=Math.floor((s%86400)/3600),m=Math.floor((s%3600)/60);
  if(d>0)return`${d}d ${h}hr ${m}m`;if(h>0)return`${h}hr ${m}m`;return`${m}m`;
}
function fmtKb(kb){return kb<1024?`${kb.toFixed(1)} KB/s`:`${(kb/1024).toFixed(1)} MB/s`}
function nowTs(){return new Date().toLocaleTimeString("en-US",{hour12:false,hour:"2-digit",minute:"2-digit",second:"2-digit"})}
function stripAnsi(s){
  return(s||"").replace(/\x1B\[[0-9;]*[a-zA-Z]/g,"").replace(/\x1B\][^\x07]*\x07/g,"")
    .replace(/\x1B[@-Z\\-_]/g,"").replace(/\r\n/g,"\n").replace(/\r/g,"\n");
}

// ── Live Clock ─────────────────────────────────────────────────────────────────
function LiveClock() {
  const [t, setT] = useState(() => new Date().toLocaleTimeString("tr-TR", {hour12:false}));
  useEffect(() => {
    const iv = setInterval(() => setT(new Date().toLocaleTimeString("tr-TR", {hour12:false})), 1000);
    return () => clearInterval(iv);
  }, []);
  return <span className="up-badge" style={{color:"var(--txt-dim)",fontFamily:"var(--f-mono)",fontSize:"11px"}}>{t}</span>;
}

// ── VAULT Holographic Animation ────────────────────────────────────────────────
function VaultHoloAnimation({activeModel,animState}){
  const canvasRef=useRef(null);
  const rafRef=useRef(null);
  const tRef=useRef(0);
  const prevModelRef=useRef(activeModel);
  const transRef=useRef(1);
  useEffect(()=>{
    const canvas=canvasRef.current;
    if(!canvas)return;
    const ctx=canvas.getContext("2d");
    const resize=()=>{const p=canvas.parentElement;if(!p)return;canvas.width=p.clientWidth;canvas.height=p.clientHeight;};
    resize();
    const ro=new ResizeObserver(resize);
    if(canvas.parentElement)ro.observe(canvas.parentElement);
    const lerp=(a,b,t)=>a+(b-a)*t;
    const lerpC=(c1,c2,t)=>({r:Math.round(lerp(c1.r,c2.r,t)),g:Math.round(lerp(c1.g,c2.g,t)),b:Math.round(lerp(c1.b,c2.b,t))});
    let lastT=performance.now();
    const drawHexPath=(ctx,cx,cy,r,rot)=>{ctx.beginPath();for(let i=0;i<6;i++){const a=(i*Math.PI/3)+rot;const x=cx+r*Math.cos(a),y=cy+r*Math.sin(a);i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);}ctx.closePath();};
    const drawArcSeg=(ctx,cx,cy,r,a0,a1,rot)=>{ctx.save();ctx.translate(cx,cy);ctx.rotate(rot);ctx.beginPath();ctx.arc(0,0,r,a0,a1);ctx.stroke();ctx.restore();};
    const animate=(now)=>{
      rafRef.current=requestAnimationFrame(animate);
      const dt=Math.min((now-lastT)/1000,0.05);lastT=now;tRef.current+=dt;const t=tRef.current;
      if(prevModelRef.current!==activeModel){prevModelRef.current=activeModel;transRef.current=0;}
      transRef.current=Math.min(transRef.current+dt*2.5,1);
      const baseColor=CLR_RGB[activeModel]||CLR_RGB.claude;
      const prevColor=CLR_RGB[prevModelRef.current]||CLR_RGB.claude;
      const col=lerpC(prevColor,baseColor,transRef.current);
      const rgba=(a)=>`rgba(${col.r},${col.g},${col.b},${a})`;
      const spd=animState==="responding"?2.8:animState==="active"?1.6:0.65;
      const base=animState==="responding"?0.88:animState==="active"?0.68:0.48;
      const W=canvas.width,H=canvas.height;const cx=W/2,cy=H/2;
      ctx.clearRect(0,0,W,H);
      ctx.save();ctx.strokeStyle=rgba(0.035*base/0.32);ctx.lineWidth=0.5;
      const gs=50;
      for(let x=0;x<W;x+=gs){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}
      for(let y=0;y<H;y+=gs){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
      ctx.restore();
      for(let ring=0;ring<4;ring++){
        const r=70+ring*65;const rot=t*spd*(ring%2===0?0.22:-0.18);const a=Math.max(0,(0.18-ring*0.035)*base/0.32);
        ctx.save();ctx.strokeStyle=rgba(a);ctx.lineWidth=1;drawHexPath(ctx,cx,cy,r,rot);ctx.stroke();
        for(let i=0;i<6;i++){const ang=(i*Math.PI/3)+rot;ctx.fillStyle=rgba(Math.min(1,a*1.8));ctx.beginPath();ctx.arc(cx+r*Math.cos(ang),cy+r*Math.sin(ang),2,0,Math.PI*2);ctx.fill();}
        ctx.restore();
      }
      for(let i=1;i<=3;i++){const pulse=Math.sin(t*spd*1.8+i*Math.PI/2.5);const r=28+i*18+pulse*6;ctx.save();ctx.strokeStyle=rgba(Math.min(1,(0.22+pulse*0.07)*base/0.32));ctx.lineWidth=1;ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.stroke();ctx.restore();}
      const arcRot=t*spd*0.45;
      [{r:130,a0:0,a1:Math.PI/2.5,rot:arcRot},{r:130,a0:Math.PI,a1:Math.PI*1.4,rot:arcRot},{r:190,a0:Math.PI/5,a1:Math.PI*0.9,rot:-arcRot*0.65},{r:190,a0:Math.PI*1.2,a1:Math.PI*1.85,rot:-arcRot*0.65},{r:260,a0:0,a1:Math.PI/3,rot:arcRot*0.4},{r:260,a0:Math.PI,a1:Math.PI*4/3,rot:arcRot*0.4}].forEach(({r,a0,a1,rot})=>{ctx.save();ctx.strokeStyle=rgba(Math.min(1,0.28*base/0.32));ctx.lineWidth=1.5;drawArcSeg(ctx,cx,cy,r,a0,a1,rot);ctx.restore();});
      const glow=(0.55+Math.sin(t*spd*1.4)*0.18)*base/0.32;
      const fs=Math.min(W*0.16,110);
      ctx.save();ctx.shadowColor=`rgb(${col.r},${col.g},${col.b})`;ctx.shadowBlur=25*Math.min(1,glow);ctx.fillStyle=rgba(Math.min(1,glow*0.9));ctx.font=`700 ${fs}px 'Fira Code', monospace`;ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText("V.A.U.L.T.",cx,cy-22);ctx.restore();
      const sub=animState==="responding"?"PROCESSING . . .":animState==="active"?"● ACTIVE":`MARK XXVII · ${(activeModel==="web"?"GEMINI WEB":activeModel).toUpperCase()}`;
      ctx.save();ctx.fillStyle=rgba(Math.min(1,glow*0.55));ctx.font=`${Math.min(W*0.02,13)}px 'Fira Code', monospace`;ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(sub,cx,cy+fs*0.4+8);ctx.restore();
      const hud=24;const hm=16;
      [[hm,hm,1,1],[W-hm,hm,-1,1],[W-hm,H-hm,-1,-1],[hm,H-hm,1,-1]].forEach(([x,y,sx,sy])=>{ctx.save();ctx.strokeStyle=rgba(Math.min(1,0.35*base/0.32));ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(x+sx*hud*0.55,y);ctx.lineTo(x,y);ctx.lineTo(x,y+sy*hud*0.55);ctx.stroke();ctx.restore();});
    };
    animate(performance.now());
    return()=>{cancelAnimationFrame(rafRef.current);ro.disconnect()};
  },[activeModel,animState]);
  return <canvas ref={canvasRef} style={{position:"absolute",inset:0,width:"100%",height:"100%",pointerEvents:"none",zIndex:0}}/>;
}

// ── Context Bridge ────────────────────────────────────────────────────────────
function ContextBridge({counts,termRefs,onLog,onSwitch}){
  const[showModal,setShowModal]=useState(false);const[src,setSrc]=useState(null);const[target,setTarget]=useState(null);const[note,setNote]=useState("");const[busy,setBusy]=useState(false);
  const openModal=m=>{setSrc(m);setTarget(null);setNote("");setShowModal(true)};
  const cleanBrief=(text)=>text.replace(/\x1B\[[0-9;]*[a-zA-Z]/g,'').replace(/\r\n/g,'\n').replace(/\r/g,'\n').replace(/\n{3,}/g,'\n\n').replace(/[ \t]+$/gm,'').trim();
  const formatAsMarkdown=(text,src,target,ts)=>`\r\n## Context Bridge: ${src.toUpperCase()} -> ${target.toUpperCase()} [${ts}]\r\n\r\n${cleanBrief(text)}\r\n\r\n---\r\n`;
  const doTransfer=async()=>{
    if(!src||!target||busy)return;setBusy(true);
    try{
      const srcRef=termRefs.current[src];let history=srcRef?.getText?.()||"";history=stripAnsi(history).slice(-4500);
      const res=await fetch(`${API}/api/optimize-context`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({history,note})});
      const d=await res.json();const brief=d.optimized||cleanBrief(history.slice(-2000));
      const ws=termRefs.current[target]?.wsRef?.current;
      if(ws&&ws.readyState===1){const ts=new Date().toISOString().slice(0,16).replace("T"," ");ws.send(formatAsMarkdown(brief,src,target,ts));ws.send("\r");}
      onLog?.(`Bridge: ${src} → ${target}`,CLR[src]);onSwitch?.(target);setShowModal(false);
    }catch(e){onLog?.(`Bridge error: ${e.message}`,"#ff5a6a")}finally{setBusy(false)}
  };
  return(
    <>
      <div className="glass" style={{overflow:"hidden"}}>
        <div className="phdr"><span className="ptitle">Context · Bridge</span><span className="muted mono t9">auto @ {BRIDGE_THRESHOLD} msgs</span></div>
        <div style={{padding:"8px 12px"}}>
          {MODELS.map(m=>{const cnt=counts[m]||0;const pct=(cnt/BRIDGE_THRESHOLD)*100;const rdy=cnt>=BRIDGE_THRESHOLD;return(
            <div key={m} className="br-row">
              <div className="br-dot" style={{background:CLR[m],color:CLR[m]}}/>
              <span className="br-name" style={{color:CLR[m],textTransform:"uppercase"}}>{m}</span>
              <div className="br-prog"><ProgressBar pct={pct} color={CLR[m]} h={4}/></div>
              <span className="br-cnt">{cnt}/{BRIDGE_THRESHOLD}</span>
              <button className="br-btn" disabled={cnt===0} style={{background:cnt>0?`${CLR[m]}18`:"transparent",border:`1px solid ${cnt>0?CLR[m]:"rgba(255,255,255,0.06)"}`,color:cnt>0?CLR[m]:"var(--txt-muted)"}} onClick={()=>openModal(m)}>{rdy?"⚡ Send":"Send"}</button>
            </div>
          );})}
          <div className="muted mono t9" style={{marginTop:8,lineHeight:1.7}}>Terminal oku → özetle → Hedef AI'ya gönder</div>
        </div>
      </div>
      {showModal&&(
        <div className="overlay" onClick={e=>e.target===e.currentTarget&&setShowModal(false)}>
          <div className="modal">
            <div className="modal-title" style={{color:CLR[src]}}>⚡ Transfer from {src?.toUpperCase()}</div>
            <div style={{fontSize:13,color:"var(--txt-dim)",fontFamily:"var(--f-mono)",marginBottom:12}}>OpenRouter will summarize terminal context and forward it to the target AI.</div>
            <div style={{marginBottom:12}}>
              <div className="muted mono t10" style={{marginBottom:7}}>Transfer to:</div>
              <div className="f gap6">{MODELS.filter(m=>m!==src).map(m=>(
                <button key={m} className="btn f1" style={{borderColor:target===m?CLR[m]:"rgba(255,255,255,0.08)",color:target===m?CLR[m]:"var(--txt-dim)",background:target===m?`${CLR[m]}18`:"transparent"}} onClick={()=>setTarget(m)}>{m.charAt(0).toUpperCase()+m.slice(1)}</button>
              ))}</div>
            </div>
            <div className="neuro-in" style={{marginBottom:12}}><input className="ki" placeholder="Optional: add a context note…" value={note} onChange={e=>setNote(e.target.value)}/></div>
            <div className="f gap6" style={{justifyContent:"flex-end"}}>
              <button className="btn" onClick={()=>setShowModal(false)}>Cancel</button>
              <button className="btn btn-cl" disabled={!target||busy} onClick={doTransfer}>{busy?"⏳ Packaging…":"⚡ Transfer"}</button>
            </div>
          </div>
        </div>
      )}
    </>
  );
}

// ── Neural Panel ──────────────────────────────────────────────────────────────
function NeuralPanel({active, animState}) {
  const canvasRef = useRef(null);
  const rafRef = useRef(null);
  const nodesRef = useRef([]);
  const tRef = useRef(0);
  useEffect(() => {
    const canvas = canvasRef.current; if(!canvas) return;
    const ctx = canvas.getContext("2d");
    const resize = () => { const p=canvas.parentElement;if(!p)return;canvas.width=p.clientWidth;canvas.height=p.clientHeight;initNodes(); };
    const initNodes = () => { const W=canvas.width,H=canvas.height;const N=28;nodesRef.current=Array.from({length:N},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-0.5)*0.4,vy:(Math.random()-0.5)*0.4,r:2+Math.random()*2.5,pulse:Math.random()*Math.PI*2})); };
    resize();const ro=new ResizeObserver(resize);if(canvas.parentElement)ro.observe(canvas.parentElement);
    const colorMap={claude:"224,157,85",gemini:"184,141,232",kimi:"90,184,255",web:"240,192,64"};
    let lastT=performance.now();
    const animate=(now)=>{
      rafRef.current=requestAnimationFrame(animate);const dt=Math.min((now-lastT)/1000,0.05);lastT=now;tRef.current+=dt;const t=tRef.current;
      const W=canvas.width,H=canvas.height;const col=colorMap[active]||colorMap.claude;
      const spd=animState==="responding"?1.8:animState==="active"?1.2:0.7;
      ctx.clearRect(0,0,W,H);
      const nodes=nodesRef.current;
      nodes.forEach(n=>{n.x+=n.vx*spd;n.y+=n.vy*spd;n.pulse+=dt*1.8*spd;if(n.x<0||n.x>W)n.vx*=-1;if(n.y<0||n.y>H)n.vy*=-1;n.x=Math.max(0,Math.min(W,n.x));n.y=Math.max(0,Math.min(H,n.y));});
      const maxDist=Math.min(W,H)*0.55;
      for(let i=0;i<nodes.length;i++){for(let j=i+1;j<nodes.length;j++){const dx=nodes[i].x-nodes[j].x,dy=nodes[i].y-nodes[j].y,d=Math.sqrt(dx*dx+dy*dy);if(d<maxDist){const a=(1-d/maxDist)*0.18;ctx.save();ctx.strokeStyle=`rgba(${col},${a})`;ctx.lineWidth=0.8;ctx.beginPath();ctx.moveTo(nodes[i].x,nodes[i].y);ctx.lineTo(nodes[j].x,nodes[j].y);ctx.stroke();ctx.restore();}}}
      nodes.forEach(n=>{const pulse=0.4+Math.sin(n.pulse)*0.35;ctx.save();ctx.shadowColor=`rgb(${col})`;ctx.shadowBlur=6*pulse;ctx.fillStyle=`rgba(${col},${pulse*0.9})`;ctx.beginPath();ctx.arc(n.x,n.y,n.r*(0.8+Math.sin(n.pulse)*0.2),0,Math.PI*2);ctx.fill();ctx.restore();});
      ctx.save();ctx.fillStyle=`rgba(${col},0.15)`;ctx.font="700 11px 'Fira Code', monospace";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText("NEURAL · NETWORK",W/2,H/2);ctx.restore();
    };
    animate(performance.now());
    return()=>{cancelAnimationFrame(rafRef.current);ro.disconnect();};
  },[active,animState]);
  return (
    <div className="glass" style={{overflow:"hidden",height:180,position:"relative"}}>
      <div className="phdr" style={{position:"relative",zIndex:1}}><span className="ptitle">Neural · Network</span><span className="muted mono t9">{active.toUpperCase()}</span></div>
      <div style={{position:"relative",height:"calc(100% - 37px)"}}><canvas ref={canvasRef} style={{position:"absolute",inset:0,width:"100%",height:"100%"}}/></div>
    </div>
  );
}

// ── Council Panel (Standard + Debate Mode) ────────────────────────────────────
function CouncilPanel({onLog}) {
  const [open, setOpen] = useState(false);
  const [debateMode, setDebateMode] = useState(false);
  const [prompt, setPrompt] = useState("");
  const [system, setSystem] = useState("");
  const [busy, setBusy] = useState(false);
  const [results, setResults] = useState(null);
  const [debateResults, setDebateResults] = useState(null);
  const [showSystem, setShowSystem] = useState(false);
  const [models, setModels] = useState({claude:"claude-3.5-haiku",gemini:"gemini-2.0-flash",kimi:"qwen3-8b"});
  const [expandedRound, setExpandedRound] = useState({r1:false,r2:true,synth:true});

  useEffect(() => {
    fetch(`${API}/api/council-models`).then(r=>r.json()).then(d=>setModels(d.models||d)).catch(()=>{});
  }, []);

  const send = async () => {
    if(!prompt.trim() || busy) return;
    setBusy(true); setResults(null); setDebateResults(null);
    try {
      if(debateMode) {
        const r = await fetch(`${API}/api/council-debate`, {
          method:"POST", headers:{"Content-Type":"application/json"},
          body: JSON.stringify({prompt: prompt.trim()})
        });
        const d = await r.json();
        if(!r.ok){ setResults([{model:"error",slot:"error",error:d.error||`HTTP ${r.status}`}]); return; }
        setDebateResults(d);
        onLog?.("Debate Council complete — synthesis ready", "var(--yellow)");
      } else {
        const r = await fetch(`${API}/api/council`, {
          method:"POST", headers:{"Content-Type":"application/json"},
          body: JSON.stringify({prompt: prompt.trim(), system: system.trim()})
        });
        const d = await r.json();
        if(!r.ok){ setResults([{model:"error",slot:"error",error:d.error||`HTTP ${r.status}`}]); return; }
        setResults(d.results || []);
        onLog?.("Council session complete", "var(--yellow)");
      }
    } catch(e) { setResults([{model:"error",slot:"error",error:e.message}]); }
    finally { setBusy(false); }
  };

  const RoundBlock = ({title, color, data, expanded, onToggle}) => (
    <div style={{marginBottom:8,border:`1px solid ${color}33`,borderRadius:8,overflow:"hidden"}}>
      <div className="rnd-hdr" style={{color}} onClick={onToggle}>
        <span>{title}</span><span style={{opacity:0.5}}>{expanded?"▲":"▼"}</span>
      </div>
      {expanded && (
        <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:6,padding:8}}>
          {(data||[]).map((r,i)=>{

            return(
              <div key={i} style={{background:"#04070f",border:`1px solid ${c}22`,borderRadius:6,overflow:"hidden"}}>
                <div style={{padding:"4px 8px",borderBottom:`1px solid ${c}22`,fontFamily:"var(--f-mono)",fontSize:9,color:c,textTransform:"uppercase",letterSpacing:"0.08em"}}>● {slot} {r.tokens?`· ${r.tokens}t`:""}</div>
                <div style={{padding:"6px 8px",fontFamily:"var(--f-mono)",fontSize:10.5,color:"var(--txt-dim)",lineHeight:1.6,whiteSpace:"pre-wrap",wordBreak:"break-word",maxHeight:200,overflowY:"auto"}}>
                  {r.error?<span style={{color:"#ff5a6a"}}>Error: {r.error}</span>:r.response}
                </div>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );

  return (
    <>
      <div className="glass" style={{overflow:"hidden"}}>
        <div className="phdr">
          <span className="ptitle">AI · Council</span>
          <div className="f ac gap4">
            <button className="icon-btn" onClick={()=>setDebateMode(d=>!d)} style={{color:debateMode?"var(--yellow)":"var(--txt-muted)",borderColor:debateMode?"var(--yellow)":"var(--border)",background:debateMode?"rgba(240,192,64,0.08)":"transparent"}}>{debateMode?"Debate ON":"Debate"}</button>
          </div>
        </div>
        <div style={{padding:"8px 10px"}}>
          <div className="muted mono t10" style={{marginBottom:8,lineHeight:1.6}}>
            {debateMode?"3 AIs debate in 2 rounds → synthesis":"3 AIs respond in parallel via API"}
          </div>
          <div className="f ac gap4" style={{marginBottom:8}}>
            {["claude","gemini","kimi"].map(m=>(
              <div key={m} className="f ac gap4" style={{padding:"3px 8px",borderRadius:4,background:`${CLR[m]}18`,border:`1px solid ${CLR[m]}44`}}>
                <div className="ai-dot" style={{background:CLR[m],color:CLR[m]}}/>
                <div style={{display:"flex",flexDirection:"column",gap:0}}>
                  <span style={{fontFamily:"var(--f-mono)",fontSize:10,color:CLR[m]}}>{m}</span>
                  <span style={{fontFamily:"var(--f-mono)",fontSize:"7.5px",color:"var(--txt-muted)",opacity:0.7,maxWidth:70,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{models[m]}</span>
                </div>
              </div>
            ))}
          </div>
          <button className="btn btn-yw" style={{width:"100%"}} onClick={()=>setOpen(true)}>
            {debateMode?"⚡ Open Debate Council":"⚡ Open Council"}
          </button>
        </div>

      {open && (

// ── File Dropzone ─────────────────────────────────────────────────────────────
function FileDropzone({onLog,active}){
  const[over,setOver]=useState(false);const[files,setFiles]=useState([]);const inp=useRef(null);
  const upload=async file=>{
    const fd=new FormData();fd.append("file",file);
    try{const r=await fetch(`${API}/api/upload`,{method:"POST",body:fd});const d=await r.json();if(d.filename){setFiles(f=>[{name:d.filename,size:d.size,t:nowTs()},...f].slice(0,5));onLog?.(`Uploaded: ${d.filename}`,"#3ddc97")}
    }catch(e){onLog?.(`Upload error: ${e.message}`,"#ff5a6a")}
  };
  const onDrop=async e=>{e.preventDefault();setOver(false);for(const f of e.dataTransfer.files)await upload(f)};
  return(
    <div className="glass" style={{overflow:"hidden"}}>
      <div className="phdr"><span className="ptitle">File · Drop</span><span className="muted mono t9">{active}</span></div>
      <div style={{padding:"9px 10px"}}>
        <div className={`dz${over?" ov":""}`} onDrop={onDrop} onDragOver={e=>{e.preventDefault();setOver(true)}} onDragLeave={()=>setOver(false)} onClick={()=>inp.current?.click()}>
          <span className="dz-icon">⊕</span>Drop files or click to upload
        </div>
        <input ref={inp} type="file" multiple style={{display:"none"}} onChange={e=>{for(const f of e.target.files)upload(f)}}/>
        {files.map((f,i)=>(
          <div key={i} className="f ac gap4" style={{padding:"3px 0",borderBottom:"1px solid rgba(255,255,255,0.03)"}}>
            <span className="muted mono t9">{f.t}</span>
            <span className="mono t9" style={{flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",color:"#3ddc97"}}>{f.name}</span>
            <span className="muted mono t9">{(f.size/1024).toFixed(1)}k</span>
          </div>
        ))}
      </div>
    </div>
  );
}

// ── Gemini Floating Panel ─────────────────────────────────────────────────────
function GeminiFloatingPanel({open, onClose}) {
  const [pinned, setPinned] = useState(() => localStorage.getItem("gemini_float_pinned") !== "false");
  const [pos, setPos] = useState({x: Math.max(0, window.innerWidth - 440), y: Math.max(0, window.innerHeight - 660)});
  const [blocked, setBlocked] = useState(false);
  const [iframeKey, setIframeKey] = useState(0);
  const [popupOpen, setPopupOpen] = useState(false);
  const popupRef = useRef(null);
  const dragRef = useRef({active:false,ox:0,oy:0});

  const W = 440, H = 640;
  const PW = 1280, PH = 860;
  const PRO_URL = "https://accounts.google.com/AccountChooser?Email=vodkakutay%40gmail.com&continue=" + encodeURIComponent("https://gemini.google.com/app");

  useEffect(()=>{ localStorage.setItem("gemini_float_pinned", pinned ? "true" : "false"); },[pinned]);

  useEffect(()=>{
    if(!popupOpen)return;
    const iv=setInterval(()=>{ if(popupRef.current?.closed){setPopupOpen(false);popupRef.current=null;} },1000);
    return()=>clearInterval(iv);
  },[popupOpen]);

  useEffect(()=>{
    const onMove=(e)=>{ if(!dragRef.current.active)return; setPos({x:e.clientX-dragRef.current.ox,y:e.clientY-dragRef.current.oy}); };
    const onUp=()=>{ dragRef.current.active=false; };
    document.addEventListener("mousemove",onMove);
    document.addEventListener("mouseup",onUp);
    return()=>{ document.removeEventListener("mousemove",onMove); document.removeEventListener("mouseup",onUp); };
  },[]);

  const openPopup=useCallback(()=>{
    if(popupRef.current&&!popupRef.current.closed){popupRef.current.focus();return;}
    const left=Math.round(Math.max(0,(window.screen.availWidth-PW)/2));
    const top=Math.round(Math.max(0,(window.screen.availHeight-PH)/2));
    const p=window.open(PRO_URL,"gemini_float_win",`width=${PW},height=${PH},left=${left},top=${top},menubar=no,toolbar=no,location=no,status=no,resizable=yes,scrollbars=yes`);
    if(p){popupRef.current=p;setPopupOpen(true);}
  },[]);

  if(!open)return null;

  const posStyle=pinned?{right:20,bottom:20}:{left:pos.x,top:pos.y};

  return (
    <div style={{position:"fixed",...posStyle,width:W,height:H,zIndex:8500,background:"#070b14",border:"1px solid rgba(184,141,232,0.35)",borderRadius:12,overflow:"hidden",boxShadow:"0 12px 48px rgba(0,0,0,0.85), 0 0 24px rgba(184,141,232,0.08)",display:"flex",flexDirection:"column"}}>
      {/* Header */}
      <div
        onMouseDown={(e)=>{if(!pinned){dragRef.current={active:true,ox:e.clientX-pos.x,oy:e.clientY-pos.y};e.preventDefault();}}}
        style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"7px 10px",background:"rgba(184,141,232,0.08)",borderBottom:"1px solid rgba(184,141,232,0.2)",cursor:pinned?"default":"move",flexShrink:0,userSelect:"none"}}
      >
        <div style={{display:"flex",alignItems:"center",gap:6}}>
          <div style={{width:7,height:7,borderRadius:"50%",background:popupOpen?"var(--gemini)":"var(--txt-muted)",boxShadow:popupOpen?"0 0 6px var(--gemini-glow)":"none"}}/>
          <span style={{fontFamily:"var(--f-mono)",fontSize:10.5,color:"var(--gemini)",letterSpacing:"0.08em",fontWeight:600}}>GEMINI · FLOAT</span>
          <span style={{fontFamily:"var(--f-mono)",fontSize:8.5,color:popupOpen?"var(--gemini)":"var(--txt-muted)",opacity:popupOpen?1:0.65}}>{popupOpen?"● active":pinned?"pinned":"free"}</span>
        </div>
        <div style={{display:"flex",gap:3}}>
          <button className="icon-btn" onClick={()=>{setBlocked(false);setIframeKey(k=>k+1);}} title="Reload iframe">↻</button>
          <button className="icon-btn" onClick={()=>setPinned(p=>!p)} title={pinned?"Unpin — enable drag":"Pin — fix to corner"} style={{color:pinned?"var(--yellow)":"var(--txt-muted)",borderColor:pinned?"rgba(240,192,64,0.3)":"var(--border)",background:pinned?"rgba(240,192,64,0.08)":"transparent"}}>
            {pinned?"📌":"📍"}
          </button>
          <button className="icon-btn" onClick={onClose} title="Close (Ctrl+Shift+G)" style={{color:"var(--red)",borderColor:"rgba(255,90,106,0.3)"}}>✕</button>
        </div>
      </div>

      {/* Content */}
      {blocked ? (
        <div style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:24,gap:14}}>
          {popupOpen ? (
            <>
              <div style={{width:12,height:12,borderRadius:"50%",background:"var(--gemini)",boxShadow:"0 0 14px var(--gemini-glow)",animation:"blink 2.5s ease-in-out infinite"}}/>
              <div style={{fontFamily:"var(--f-mono)",fontSize:13,color:"var(--gemini)",fontWeight:600,letterSpacing:"0.08em",textAlign:"center"}}>GEMINI ACTIVE</div>
              <div style={{fontFamily:"var(--f-mono)",fontSize:10,color:"var(--txt-muted)",textAlign:"center",lineHeight:1.85}}>
                <span style={{color:"var(--gemini)"}}>vodkakutay@gmail.com</span> · Pro<br/>
                <span style={{opacity:0.7}}>Switch to the Gemini window to interact</span>
              </div>
              <button className="btn btn-gm" onClick={openPopup}>Focus Gemini Window</button>
            </>
          ) : (
            <>
              <div style={{fontFamily:"var(--f-mono)",fontSize:12,color:"var(--txt-dim)",textAlign:"center",lineHeight:1.9}}>
                Google blocks direct embedding.<br/>
                Open as a borderless floating window.
              </div>
              <button className="btn btn-gm" style={{padding:"9px 24px"}} onClick={openPopup}>↗ Open Gemini Window</button>
              <div style={{fontFamily:"var(--f-mono)",fontSize:9.5,color:"var(--txt-muted)",textAlign:"center",lineHeight:1.9}}>
                Account: <span style={{color:"var(--gemini)"}}>vodkakutay@gmail.com</span> (Pro)<br/>
                <span style={{opacity:0.65}}>420×600 · Ctrl+Shift+G to toggle</span>
              </div>
            </>
          )}
        </div>
      ) : (
        <iframe
          key={iframeKey}
          src={`http://localhost:8765/api/proxy?url=${encodeURIComponent(PRO_URL)}`}
          style={{flex:1,border:"none",width:"100%",height:"100%"}}
          sandbox="allow-same-origin allow-scripts allow-forms allow-popups allow-top-navigation allow-modals allow-downloads"
          allow="camera; microphone; clipboard-read; clipboard-write"
          onLoad={e=>{try{const doc=e.target.contentDocument;if(!doc||doc.URL==="about:blank"){setBlocked(true);}}catch{setBlocked(true);}}}
        />
      )}
    </div>
  );
}

// ── Terminal Pane ─────────────────────────────────────────────────────────────
const TCFG={
  fontFamily:"'Fira Code','Cascadia Code',monospace",
  fontSize:13,lineHeight:1.4,cursorBlink:true,cursorStyle:"bar",scrollback:3000,
  allowTransparency:true,
  theme:{
    background:"rgba(3,5,9,0.72)",foreground:"#e2eaf8",cursor:"#e09d55",cursorAccent:"#04060a",
    selectionBackground:"rgba(90,184,255,0.22)",
    black:"#0d1117",red:"#ff5a6a",green:"#3ddc97",yellow:"#f0c040",
    blue:"#5ab8ff",magenta:"#b88de8",cyan:"#5ee7d0",white:"#e2eaf8",
    brightBlack:"#3a4a60",brightRed:"#ff7a87",brightGreen:"#6effc2",brightYellow:"#ffdf80",
    brightBlue:"#85c2ff",brightMagenta:"#c4a2f2",brightCyan:"#85f0e0",brightWhite:"#f0f5ff",
  },
};

function TerminalPane({model,visible,wsObj,bcRef,onTextReady,onMsg,onReady,onUserInput,onUserSend}){
  const cRef=useRef(null);const tRef=useRef(null);const fRef=useRef(null);const init=useRef(false);
  const inputBuf=useRef("");const onUserInputRef=useRef(onUserInput);const onUserSendRef=useRef(onUserSend);
  useEffect(()=>{onUserInputRef.current=onUserInput},[onUserInput]);
  useEffect(()=>{onUserSendRef.current=onUserSend},[onUserSend]);
  useEffect(()=>{
    if(init.current||!cRef.current)return;init.current=true;
    const term=new Terminal(TCFG);const fit=new FitAddon.FitAddon();
    term.loadAddon(fit);term.open(cRef.current);fit.fit();tRef.current=term;fRef.current=fit;
    cRef.current.addEventListener('paste',(e)=>{
      e.preventDefault();e.stopPropagation();
      const text=e.clipboardData?.getData('text');
      if(!text)return;
      const ws=wsObj.current;if(ws&&ws.readyState===1)ws.send('\x1b[200~'+text+'\x1b[201~');
    },true);
    onTextReady?.(model,()=>{const lines=[];for(let i=0;i<term.buffer.active.length;i++)lines.push(term.buffer.active.getLine(i)?.translateToString(true)||"");return lines.join("\n");});
    const connect=()=>{
      const ws=new WebSocket(`${WS_BASE}/ws/pty/${model}`);wsObj.current=ws;
      ws.onopen=()=>{ws.send(JSON.stringify({type:"resize",cols:term.cols,rows:term.rows}));onReady?.()};
      ws.onmessage=e=>term.write(e.data);ws.onerror=()=>{};ws.onclose=()=>setTimeout(connect,3000);
    };
    connect();
    term.onData(d=>{
      const ws=wsObj.current;
      if(ws&&ws.readyState===1){
        if(d==='\x16'){navigator.clipboard.readText().then(t=>{if(t&&ws.readyState===1)ws.send('\x1b[200~'+t+'\x1b[201~');}).catch(()=>ws.send(d));return;}
        ws.send(d);if(bcRef?.current)bcRef.current(d,model);
        if(d==="\r"){
          const hasContent=inputBuf.current.trim().length>0;inputBuf.current="";
          if(model==="claude"&&hasContent)fetch(`${API}/api/claude-usage/increment`,{method:"POST"}).catch(()=>{});
          onMsg?.();onUserSendRef.current?.();
        }else{
          if(d==="\x7f"||d==="\b"){inputBuf.current=inputBuf.current.slice(0,-1);}
          else if(d.length===1&&d.charCodeAt(0)>=32){inputBuf.current+=d;}
          onUserInputRef.current?.();
        }
      }
    });
    const ro=new ResizeObserver(()=>{try{fit.fit()}catch{}const ws=wsObj.current;if(ws&&ws.readyState===1)ws.send(JSON.stringify({type:"resize",cols:term.cols,rows:term.rows}));});
    ro.observe(cRef.current);
    return()=>{ro.disconnect();try{term.dispose()}catch{}};
  },[]);
  useEffect(()=>{if(visible&&fRef.current)setTimeout(()=>{try{fRef.current.fit()}catch{}},55);},[visible]);
  return <div ref={cRef} className={`xw${visible?" vis":""}`}/>;
}

// ── Terminal Hub ──────────────────────────────────────────────────────────────
function TerminalHub({counts,termRefs,onMsg,active,setActive,onLog,onUserInput,onUserSend,onToggleGeminiFloat}){
  const[bc,setBc]=useState(false);
  const wsObjs=useRef({claude:{current:null},gemini:{current:null},kimi:{current:null}});
  const bcRef=useRef(null);const textGetters=useRef({});

  useEffect(()=>{
    if(bc){bcRef.current=(data,srcModel)=>{MODELS.forEach(m=>{if(m!==srcModel){const ws=wsObjs.current[m]?.current;if(ws&&ws.readyState===1)ws.send(data)}});};}
    else{bcRef.current=null}
  },[bc]);

  useEffect(()=>{
    MODELS.forEach(m=>{termRefs.current[m]={wsRef:wsObjs.current[m],getText:()=>textGetters.current[m]?.()||""};});
  });

  const onTextReady=useCallback((model,getter)=>{textGetters.current[model]=getter},[]);
  const aiClass=m=>m==="claude"?"cl":m==="gemini"?"gm":m==="kimi"?"km":"wb";

  return(
    <div className="glass" style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden"}}>
      <div className="term-tabs">
        {ALL_TABS.map(m=>(
          <button key={m} className={`t-tab${active===m?` active ${aiClass(m)}`:""}`} onClick={()=>setActive(m)}>
            <span style={{marginRight:5,fontSize:9}}>●</span>
            {m==="web"?"Gemini Web":m.charAt(0).toUpperCase()+m.slice(1)}
            {m!=="web"&&counts[m]>0&&(
              <span style={{marginLeft:5,fontSize:9.5,padding:"1px 5px",borderRadius:10,background:`${CLR[m]}22`,color:CLR[m],fontFamily:"var(--f-mono)"}}>
                {counts[m]}
              </span>
            )}
          </button>
        ))}
        <button className={`bc-btn${bc?" on":""}`} onClick={()=>setBc(b=>!b)}
          title="Broadcast Mode: sends your keystrokes to ALL 3 terminals simultaneously.">
          {bc?"⚡ Broadcast ON":"Broadcast"}
        </button>
      </div>
      {bc && (
        <div style={{padding:"3px 10px",background:"rgba(240,192,64,0.08)",borderBottom:"1px solid rgba(240,192,64,0.2)",fontFamily:"var(--f-mono)",fontSize:"10px",color:"var(--yellow)"}}>
          ⚡ Broadcast Mode: Her tuş 3 terminale aynı anda gönderiliyor
        </div>
      )}
      <div className="term-body">
        <VaultHoloAnimation activeModel={active==="web"?"gemini":active} animState={termRefs._animState||"idle"}/>
        {MODELS.map(m=>(
          <TerminalPane key={m} model={m} visible={active===m}
            wsObj={wsObjs.current[m]} bcRef={bcRef}
            onTextReady={onTextReady}
            onMsg={()=>onMsg(m)}
            onReady={()=>onLog?.(`${m} terminal ready`,CLR[m])}
            onUserInput={onUserInput}
            onUserSend={onUserSend}/>
        ))}
        <GeminiWebPane visible={active==="web"} onToggleFloat={onToggleGeminiFloat}/>
      </div>
    </div>
  );
}

// ── App ───────────────────────────────────────────────────────────────────────
function App(){
  const[metrics,setMetrics]=useState({});
  const[logs,setLogs]=useState([]);
  const[active,setActive]=useState("claude");
  const[counts,setCounts]=useState({claude:0,gemini:0,kimi:0});
  const[animState,setAnimState]=useState("idle");
  const[geminiFloat,setGeminiFloat]=useState(()=>localStorage.getItem("gemini_float_open")==="true");
  const termRefs=useRef({});
  const animTimerRef=useRef(null);

  useEffect(()=>{ localStorage.setItem("gemini_float_open",geminiFloat?"true":"false"); },[geminiFloat]);

  useEffect(()=>{
    const h=(e)=>{ if(e.ctrlKey&&e.shiftKey&&(e.key==="G"||e.key==="g")){e.preventDefault();setGeminiFloat(o=>!o);} };
    document.addEventListener("keydown",h);
    return()=>document.removeEventListener("keydown",h);
  },[]);

  const addLog=useCallback((msg,color="var(--txt-muted)")=>{
    setLogs(l=>[...l.slice(-99),{msg,color,time:nowTs()}]);
  },[]);

  const onMsg=useCallback(m=>{if(MODELS.includes(m))setCounts(c=>({...c,[m]:c[m]+1}))},[]);

  const handleSwitch=useCallback((model)=>{
    setActive(model);
    if(MODELS.includes(model)){
      setAnimState("responding");clearTimeout(animTimerRef.current);
      animTimerRef.current=setTimeout(()=>setAnimState("idle"),1200);
    }
  },[]);

  const handleUserInput=useCallback(()=>{
    if(animState==="responding")return;
    setAnimState("active");clearTimeout(animTimerRef.current);
    animTimerRef.current=setTimeout(()=>setAnimState("idle"),3000);
  },[animState]);

  const handleUserSend=useCallback(()=>{
    setAnimState("responding");clearTimeout(animTimerRef.current);
    animTimerRef.current=setTimeout(()=>setAnimState("idle"),9000);
  },[]);

  termRefs._animState=animState;

  useEffect(()=>{
    let ws;
    const connect=()=>{
      ws=new WebSocket(`${WS_BASE}/ws/metrics`);
      ws.onmessage=e=>{try{setMetrics(JSON.parse(e.data))}catch{}};
      ws.onclose=()=>setTimeout(connect,3000);ws.onerror=()=>{};
    };
    connect();
    return()=>{try{ws?.close()}catch{}};
  },[]);

  useEffect(()=>{
    addLog("V.A.U.L.T. MARK XXVII online","var(--claude)");
    addLog("Debate Council initialized","var(--yellow)");
    addLog("Deep Research engine ready","var(--green)");
    addLog("Gemini Float ready · Ctrl+Shift+G","var(--gemini)");
  },[]);

  const shutdown=async()=>{
    if(!confirm("V.A.U.L.T. backend'i kapat?"))return;
    await fetch(`${API}/api/shutdown`,{method:"POST"}).catch(()=>{});
    addLog("Backend shutdown sent","#ff5a6a");
  };

  return(
    <div id="root" style={{height:"100vh",display:"flex",flexDirection:"column",overflow:"hidden"}}>
      <header className="app-header">
        <div className="s-dot"/>
        <div>
          <div className="logo-mark">V.A.U.L.T.</div>
          <div className="logo-sub">Virtual Assistant for Universal &amp; Local Tasks</div>
        </div>
        <div style={{flex:1}}/>
        <div className="f ac gap6">
          {MODELS.map(m=>(
            <div key={m} className="ai-dot" style={{background:CLR[m],color:CLR[m],opacity:active===m?1:0.4,transition:"opacity 0.3s"}}/>
          ))}
          <span className="muted mono t9" style={{marginLeft:4}}>3 AI + Web</span>
        </div>
        <span className="up-badge" style={{color:"#3ddc97",marginRight:4}}>↑ {metrics.uptime||"00:00"}</span>
        <LiveClock/>
        <span className="muted mono t9" style={{letterSpacing:"0.1em",marginLeft:6,marginRight:6}}>
          <span style={{color:CLR[active]||"var(--yellow)",textShadow:`0 0 8px ${CLR[active]||"var(--yellow)"}`}}>● {active==="web"?"GEMINI WEB":active.toUpperCase()}</span>
        </span>
        <span className="up-badge" style={{color:"var(--txt-muted)",fontSize:"9px",letterSpacing:"0.06em"}}>MARK XXVII</span>
        <button className="icon-btn" onClick={shutdown} style={{color:"#ff5a6a",borderColor:"rgba(255,90,106,0.3)",marginLeft:6}} title="Shutdown backend">⏻</button>
      </header>

      <main className="app-main">
        <aside className="panel-l">
          <UsageDashboard/>
          <ContextBridge counts={counts} termRefs={termRefs} onLog={addLog} onSwitch={handleSwitch}/>
          <SysMonitor m={metrics}/>
        </aside>

        <div className="panel-c">
          <TerminalHub counts={counts} termRefs={termRefs} onMsg={onMsg}
            active={active} setActive={handleSwitch} onLog={addLog}
            onUserInput={handleUserInput} onUserSend={handleUserSend}
            onToggleGeminiFloat={()=>setGeminiFloat(o=>!o)}/>
        </div>

        <aside className="panel-r">
          <PromptOptimizer onLog={addLog}/>
          <NeuralPanel active={active==="web"?"gemini":active} animState={animState}/>
          <CouncilPanel onLog={addLog}/>
          <DeepResearchPanel onLog={addLog}/>
          <ActivityLog entries={logs}/>
          <FileDropzone onLog={addLog} active={active}/>
        </aside>
      </main>
      <GeminiFloatingPanel open={geminiFloat} onClose={()=>setGeminiFloat(false)}/>
    </div>
  );
}
