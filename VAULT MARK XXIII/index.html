.dz{border:1px dashed rgba(255,255,255,0.12);border-radius:var(--rs);padding:12px;text-align:center;cursor:pointer;transition:all 0.18s;color:var(--txt-muted);font-size:12px}
.dz:hover,.dz.ov{border-color:var(--claude);color:var(--claude);background:var(--claude-lo)}

.t11{font-size:11px}.t10{font-size:10px}.t9{font-size:9.5px}

<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef,useCallback,useMemo}=React;
const API="http://localhost:8765";
const WS_BASE="ws://localhost:8765";
const MODELS=["claude","gemini","kimi"];
const CLR={claude:"#e09d55",gemini:"#b88de8",kimi:"#5ab8ff"};
const CLR_RGB={
  claude:{r:224,g:157,b:85},
  gemini:{r:184,g:141,b:232},
  kimi:{r:90,g:184,b:255},
};
const BRIDGE_THRESHOLD=10;

function fmtSecs(s){
  s=Math.floor(s||0);if(s<=0)return"now";
  const d=Math.floor(s/86400),h=Math.floor((s%86400)/3600),m=Math.floor((s%3600)/60);
  if(d>0)return`${d}d ${h}hr ${m}m`;if(h>0)return`${h}hr ${m}m`;return`${m}m`;
}
function fmtKb(kb){return kb<1024?`${kb.toFixed(1)} KB/s`:`${(kb/1024).toFixed(1)} MB/s`}
function nowTs(){return new Date().toLocaleTimeString("en-US",{hour12:false,hour:"2-digit",minute:"2-digit",second:"2-digit"})}
function stripAnsi(s){
  return(s||"").replace(/\x1B\[[0-9;]*[a-zA-Z]/g,"").replace(/\x1B\][^\x07]*\x07/g,"")
    .replace(/\x1B[@-Z\\-_]/g,"").replace(/\r\n/g,"\n").replace(/\r/g,"\n");
}

// ── Live Clock ─────────────────────────────────────────────────────────────────
function LiveClock() {
  const [t, setT] = useState(() => new Date().toLocaleTimeString("tr-TR", {hour12:false}));
  useEffect(() => {
    const iv = setInterval(() => setT(new Date().toLocaleTimeString("tr-TR", {hour12:false})), 1000);
    return () => clearInterval(iv);
  }, []);
  return <span className="up-badge" style={{color:"var(--txt-dim)",fontFamily:"var(--f-mono)",fontSize:"11px"}}>{t}</span>;
}

// ── VAULT Holographic Animation ────────────────────────────────────────────────
function VaultHoloAnimation({activeModel,animState}){
  const canvasRef=useRef(null);
  const rafRef=useRef(null);
  const tRef=useRef(0);
  const prevModelRef=useRef(activeModel);
  const transRef=useRef(1);

  useEffect(()=>{
    const canvas=canvasRef.current;
    if(!canvas)return;
    const ctx=canvas.getContext("2d");

    const resize=()=>{
      const p=canvas.parentElement;
      if(!p)return;
      canvas.width=p.clientWidth;
      canvas.height=p.clientHeight;
    };
    resize();
    const ro=new ResizeObserver(resize);
    if(canvas.parentElement)ro.observe(canvas.parentElement);

    const lerp=(a,b,t)=>a+(b-a)*t;
    const lerpC=(c1,c2,t)=>({
      r:Math.round(lerp(c1.r,c2.r,t)),
      g:Math.round(lerp(c1.g,c2.g,t)),
      b:Math.round(lerp(c1.b,c2.b,t)),
    });

    let lastT=performance.now();

    const drawHexPath=(ctx,cx,cy,r,rot)=>{
      ctx.beginPath();
      for(let i=0;i<6;i++){
        const a=(i*Math.PI/3)+rot;
        const x=cx+r*Math.cos(a),y=cy+r*Math.sin(a);
        i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
      }
      ctx.closePath();
    };

    const drawArcSeg=(ctx,cx,cy,r,a0,a1,rot)=>{
      ctx.save();ctx.translate(cx,cy);ctx.rotate(rot);
      ctx.beginPath();ctx.arc(0,0,r,a0,a1);ctx.stroke();
      ctx.restore();
    };

    const animate=(now)=>{
      rafRef.current=requestAnimationFrame(animate);
      const dt=Math.min((now-lastT)/1000,0.05);
      lastT=now;
      tRef.current+=dt;
      const t=tRef.current;

      if(prevModelRef.current!==activeModel){
        prevModelRef.current=activeModel;
        transRef.current=0;
      }
      transRef.current=Math.min(transRef.current+dt*2.5,1);

      const c1=CLR_RGB[prevModelRef.current]||CLR_RGB.claude;
      const c2=CLR_RGB[activeModel]||CLR_RGB.claude;
      const col=lerpC(c1,c2,transRef.current);
      const rgba=(a)=>`rgba(${col.r},${col.g},${col.b},${a})`;

      const spd=animState==="responding"?2.8:animState==="active"?1.6:0.65;
      const base=animState==="responding"?0.88:animState==="active"?0.68:0.48;

      const W=canvas.width,H=canvas.height;
      const cx=W/2,cy=H/2;
      ctx.clearRect(0,0,W,H);

      // 1. Faint grid
      ctx.save();
      ctx.strokeStyle=rgba(0.035*base/0.32);
      ctx.lineWidth=0.5;
      const gs=50;
      for(let x=0;x<W;x+=gs){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}
      for(let y=0;y<H;y+=gs){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
      ctx.restore();

      // 2. Outer hex rings
      for(let ring=0;ring<4;ring++){
        const r=70+ring*65;
        const rot=t*spd*(ring%2===0?0.22:-0.18);
        const a=Math.max(0,(0.18-ring*0.035)*base/0.32);
        ctx.save();
        ctx.strokeStyle=rgba(a);ctx.lineWidth=1;
        drawHexPath(ctx,cx,cy,r,rot);ctx.stroke();
        // corner nodes
        for(let i=0;i<6;i++){
          const ang=(i*Math.PI/3)+rot;
          ctx.fillStyle=rgba(Math.min(1,a*1.8));
          ctx.beginPath();ctx.arc(cx+r*Math.cos(ang),cy+r*Math.sin(ang),2,0,Math.PI*2);ctx.fill();
        }
        ctx.restore();
      }

      // 3. Pulsing inner circles
      for(let i=1;i<=3;i++){
        const pulse=Math.sin(t*spd*1.8+i*Math.PI/2.5);
        const r=28+i*18+pulse*6;
        ctx.save();
        ctx.strokeStyle=rgba(Math.min(1,(0.22+pulse*0.07)*base/0.32));
        ctx.lineWidth=1;ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.stroke();
        ctx.restore();
      }

      // 4. Arc segments (rotating partial arcs)
      const arcRot=t*spd*0.45;
      [
        {r:130,a0:0,a1:Math.PI/2.5,rot:arcRot},
        {r:130,a0:Math.PI,a1:Math.PI*1.4,rot:arcRot},
        {r:190,a0:Math.PI/5,a1:Math.PI*0.9,rot:-arcRot*0.65},
        {r:190,a0:Math.PI*1.2,a1:Math.PI*1.85,rot:-arcRot*0.65},
        {r:260,a0:0,a1:Math.PI/3,rot:arcRot*0.4},
        {r:260,a0:Math.PI,a1:Math.PI*4/3,rot:arcRot*0.4},
      ].forEach(({r,a0,a1,rot})=>{
        ctx.save();ctx.strokeStyle=rgba(Math.min(1,0.28*base/0.32));ctx.lineWidth=1.5;
        drawArcSeg(ctx,cx,cy,r,a0,a1,rot);ctx.restore();
      });

      // 5. Model-specific effect
      if(activeModel==="kimi"||prevModelRef.current==="kimi"){
        // Vertical data streams (matrix-style)
        const n=Math.floor(W/60);
        for(let i=0;i<n;i++){
          const x=(i/(n-1||1))*W;
          const streamH=90+Math.sin(t*2.5+i*0.9)*50;
          const sy=((t*spd*90+i*70)%(H+streamH))-streamH;
          const g=ctx.createLinearGradient(x,sy,x,sy+streamH);
          g.addColorStop(0,"transparent");
          g.addColorStop(0.5,rgba(Math.min(1,0.22*base/0.32)));
          g.addColorStop(1,"transparent");
          ctx.save();ctx.strokeStyle=g;ctx.lineWidth=1;
          ctx.setLineDash([3,9]);ctx.beginPath();ctx.moveTo(x,sy);ctx.lineTo(x,sy+streamH);ctx.stroke();
          ctx.restore();
        }
      } else if(activeModel==="gemini"||prevModelRef.current==="gemini"){
        // Spiral energy rings
        for(let s=0;s<3;s++){
          const r=50+s*55+Math.sin(t*spd*1.2+s)*15;
          const phase=t*spd*(0.5+s*0.2);
          ctx.save();
          ctx.strokeStyle=rgba(Math.min(1,(0.12+s*0.03)*base/0.32));
          ctx.lineWidth=1.5;
          ctx.setLineDash([Math.PI*r/6,Math.PI*r/6]);
          ctx.lineDashOffset=-phase*r*0.5;
          ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.stroke();
          ctx.restore();
        }
      } else {
        // Claude: corner hex brackets
        const sz=32;const m=30;
        [[m,m,0],[W-m,m,1],[W-m,H-m,2],[m,H-m,3]].forEach(([x,y,q])=>{
          const dx=q===1||q===2?-sz:sz;
          const dy=q===2||q===3?-sz:sz;
          ctx.save();ctx.strokeStyle=rgba(Math.min(1,0.3*base/0.32));ctx.lineWidth=1.5;
          ctx.beginPath();ctx.moveTo(x+dx*0.6,y);ctx.lineTo(x,y);ctx.lineTo(x,y+dy*0.6);ctx.stroke();
          ctx.restore();
        });
      }

      // 6. Scan beam (active/responding)
      if(animState!=="idle"){
        const beamY=((t*spd*75)%H);
        const g=ctx.createLinearGradient(0,beamY-14,0,beamY+14);
        g.addColorStop(0,"transparent");
        g.addColorStop(0.5,rgba(Math.min(1,0.18*base/0.32)));
        g.addColorStop(1,"transparent");
        ctx.save();ctx.fillStyle=g;ctx.fillRect(0,beamY-14,W,28);ctx.restore();

        if(animState==="responding"){
          const bx=((t*spd*120+30)%W);
          const gx=ctx.createLinearGradient(bx-12,0,bx+12,0);
          gx.addColorStop(0,"transparent");
          gx.addColorStop(0.5,rgba(0.12));
          gx.addColorStop(1,"transparent");
          ctx.save();ctx.fillStyle=gx;ctx.fillRect(bx-12,0,24,H);ctx.restore();
        }
      }

      // 7. VAULT text (center)
      const glow=(0.55+Math.sin(t*spd*1.4)*0.18)*base/0.32;
      const fs=Math.min(W*0.16,110);
      ctx.save();
      ctx.shadowColor=`rgb(${col.r},${col.g},${col.b})`;
      ctx.shadowBlur=25*Math.min(1,glow);
      ctx.fillStyle=rgba(Math.min(1,glow*0.9));
      ctx.font=`700 ${fs}px 'Fira Code', monospace`;
      ctx.textAlign="center";ctx.textBaseline="middle";
      ctx.fillText("V.A.U.L.T.",cx,cy-22);
      ctx.restore();

      // Subtitle — MARK XXIII
      const sub=animState==="responding"?"PROCESSING . . .":animState==="active"?"● ACTIVE":`MARK XXIII · ${activeModel.toUpperCase()}`;
      ctx.save();
      ctx.fillStyle=rgba(Math.min(1,glow*0.55));
      ctx.font=`${Math.min(W*0.02,13)}px 'Fira Code', monospace`;
      ctx.textAlign="center";ctx.textBaseline="middle";
      ctx.fillText(sub,cx,cy+fs*0.4+8);
      ctx.restore();

      // 8. Corner HUD decorators
      const hud=24;const hm=16;
      [[hm,hm,1,1],[W-hm,hm,-1,1],[W-hm,H-hm,-1,-1],[hm,H-hm,1,-1]].forEach(([x,y,sx,sy])=>{
        ctx.save();ctx.strokeStyle=rgba(Math.min(1,0.35*base/0.32));ctx.lineWidth=1.5;
        ctx.beginPath();ctx.moveTo(x+sx*hud*0.55,y);ctx.lineTo(x,y);ctx.lineTo(x,y+sy*hud*0.55);ctx.stroke();
        ctx.restore();
      });
    };

    animate(performance.now());
    return()=>{cancelAnimationFrame(rafRef.current);ro.disconnect()};
  },[activeModel,animState]);

  return(
    <canvas ref={canvasRef} style={{
      position:"absolute",inset:0,width:"100%",height:"100%",
      pointerEvents:"none",zIndex:0,
    }}/>
  );
}

}

// ── Context Bridge ────────────────────────────────────────────────────────────
function ContextBridge({counts,termRefs,onLog,onSwitch}){
  const[showModal,setShowModal]=useState(false);
  const[src,setSrc]=useState(null);
  const[target,setTarget]=useState(null);
  const[note,setNote]=useState("");
  const[busy,setBusy]=useState(false);
  const openModal=m=>{setSrc(m);setTarget(null);setNote("");setShowModal(true)};

  const cleanBrief = (text) => {
    return text
      .replace(/\x1B\[[0-9;]*[a-zA-Z]/g, '')  // strip ANSI
      .replace(/\r\n/g, '\n')
      .replace(/\r/g, '\n')
      .replace(/\n{3,}/g, '\n\n')  // collapse 3+ blank lines to 2
      .replace(/[ \t]+$/gm, '')    // strip trailing whitespace per line
      .trim();
  };

  const formatAsMarkdown = (text, src, target, ts) => {
    return `\r\n## Context Bridge: ${src.toUpperCase()} -> ${target.toUpperCase()} [${ts}]\r\n\r\n${cleanBrief(text)}\r\n\r\n---\r\n`;
  };

  const doTransfer=async()=>{
    if(!src||!target||busy)return;
    setBusy(true);
    try{
      const srcRef=termRefs.current[src];
      let history=srcRef?.getText?.()||"";
      history=stripAnsi(history).slice(-4500);
      const res=await fetch(`${API}/api/optimize-context`,{method:"POST",
        headers:{"Content-Type":"application/json"},body:JSON.stringify({history,note})});
      const d=await res.json();
      const brief=d.optimized||cleanBrief(history.slice(-2000));
      const ws=termRefs.current[target]?.wsRef?.current;
      if(ws&&ws.readyState===1){
        const ts=new Date().toISOString().slice(0,16).replace("T"," ");
        ws.send(formatAsMarkdown(brief, src, target, ts));
        ws.send("\r");
      }
      onLog?.(`Bridge: ${src} → ${target}`,CLR[src]);
      onSwitch?.(target);setShowModal(false);
    }catch(e){onLog?.(`Bridge error: ${e.message}`,"#ff5a6a")}
    finally{setBusy(false)}
  };
  return(
    <>
      <div className="glass" style={{overflow:"hidden"}}>
        <div className="phdr">
          <span className="ptitle">Context · Bridge</span>
          <span className="muted mono t9">auto @ {BRIDGE_THRESHOLD} msgs</span>
        </div>
        <div style={{padding:"8px 12px"}}>
          {MODELS.map(m=>{
            const cnt=counts[m]||0;const pct=(cnt/BRIDGE_THRESHOLD)*100;const rdy=cnt>=BRIDGE_THRESHOLD;
            return(
              <div key={m} className="br-row">
                <div className="br-dot" style={{background:CLR[m],color:CLR[m]}}/>
                <span className="br-name" style={{color:CLR[m],textTransform:"uppercase"}}>{m}</span>
                <div className="br-prog"><ProgressBar pct={pct} color={CLR[m]} h={4}/></div>
                <span className="br-cnt">{cnt}/{BRIDGE_THRESHOLD}</span>
                <button className="br-btn" disabled={cnt===0}
                  style={{background:cnt>0?`${CLR[m]}18`:"transparent",border:`1px solid ${cnt>0?CLR[m]:"rgba(255,255,255,0.06)"}`,color:cnt>0?CLR[m]:"var(--txt-muted)"}}
                  onClick={()=>openModal(m)}>{rdy?"⚡ Send":"Send"}</button>
              </div>
            );
          })}
          <div className="muted mono t9" style={{marginTop:8,lineHeight:1.7}}>Terminal oku → OpenRouter özetle → Hedef AI'ya gönder + Enter</div>
        </div>
      </div>
      {showModal&&(
        <div className="overlay" onClick={e=>e.target===e.currentTarget&&setShowModal(false)}>
          <div className="modal">
            <div className="modal-title" style={{color:CLR[src]}}>⚡ Transfer from {src?.toUpperCase()}</div>
            <div style={{fontSize:13,color:"var(--txt-dim)",fontFamily:"var(--f-mono)",marginBottom:12}}>OpenRouter will summarize terminal context and forward it to the target AI automatically.</div>
            <div style={{marginBottom:12}}>
              <div className="muted mono t10" style={{marginBottom:7}}>Transfer to:</div>
              <div className="f gap6">
                {MODELS.filter(m=>m!==src).map(m=>(
                  <button key={m} className="btn f1"
                    style={{borderColor:target===m?CLR[m]:"rgba(255,255,255,0.08)",color:target===m?CLR[m]:"var(--txt-dim)",background:target===m?`${CLR[m]}18`:"transparent"}}
                    onClick={()=>setTarget(m)}>{m.charAt(0).toUpperCase()+m.slice(1)}</button>
                ))}
              </div>
            </div>
            <div className="neuro-in" style={{marginBottom:12}}>
              <input className="ki" placeholder="Optional: add a context note…" value={note} onChange={e=>setNote(e.target.value)}/>
            </div>
            <div className="f gap6" style={{justifyContent:"flex-end"}}>
              <button className="btn" onClick={()=>setShowModal(false)}>Cancel</button>
              <button className="btn btn-cl" disabled={!target||busy} onClick={doTransfer}>{busy?"⏳ Packaging…":"⚡ Transfer"}</button>
            </div>
          </div>
        </div>
      )}
    </>
  );
}

// ── Prompt Optimizer ──────────────────────────────────────────────────────────
function PromptOptimizer({onLog}){
  const[inp,setInp]=useState("");const[out,setOut]=useState("");const[busy,setBusy]=useState(false);const[cp,setCp]=useState(false);
  const optimize=async()=>{
    if(!inp.trim()||busy)return;setBusy(true);setOut("");
    try{
      const r=await fetch(`${API}/api/optimize-prompt`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt:inp})});

  const copy=()=>{if(!out)return;navigator.clipboard.writeText(out).then(()=>{setCp(true);setTimeout(()=>setCp(false),2000)})};
  return(
    <div className="glass" style={{overflow:"hidden"}}>
      <div className="phdr"><span className="ptitle">Prompt · Optimizer</span><div className="f ac gap4"><span className="muted mono t9">OpenRouter</span><div style={{width:7,height:7,borderRadius:"50%",background:"var(--gemini)",boxShadow:"0 0 6px var(--gemini-glow)"}}/></div></div>

        {out&&(

            <div className="f ac jb" style={{marginBottom:5}}><span className="muted mono t9">Optimized output</span><button className="icon-btn" onClick={copy}>{cp?"✓ Copied":"Copy"}</button></div>

        )}

    </div>
  );

// ── Neural Animation ──────────────────────────────────────────────────────────
function NeuralAnimation({active, animState}) {
  const canvasRef = useRef(null);
  const rafRef = useRef(null);
  const nodesRef = useRef([]);
  const tRef = useRef(0);

  useEffect(() => {
    const canvas = canvasRef.current;
    if(!canvas) return;
    const ctx = canvas.getContext("2d");

    const resize = () => {
      const p = canvas.parentElement;
      if(!p) return;
      canvas.width = p.clientWidth;
      canvas.height = p.clientHeight;
      initNodes();
    };

    const initNodes = () => {
      const W = canvas.width, H = canvas.height;
      const N = 28;
      nodesRef.current = Array.from({length: N}, (_, i) => ({
        x: Math.random() * W,
        y: Math.random() * H,
        vx: (Math.random() - 0.5) * 0.4,
        vy: (Math.random() - 0.5) * 0.4,
        r: 2 + Math.random() * 2.5,
        pulse: Math.random() * Math.PI * 2,
      }));
    };

    resize();
    const ro = new ResizeObserver(resize);
    if(canvas.parentElement) ro.observe(canvas.parentElement);

    const colorMap = {claude:"224,157,85", gemini:"184,141,232", kimi:"90,184,255"};
    let lastT = performance.now();

    const animate = (now) => {
      rafRef.current = requestAnimationFrame(animate);
      const dt = Math.min((now - lastT) / 1000, 0.05);
      lastT = now;
      tRef.current += dt;
      const t = tRef.current;

      const W = canvas.width, H = canvas.height;
      const col = colorMap[active] || colorMap.claude;
      const spd = animState === "responding" ? 1.8 : animState === "active" ? 1.2 : 0.7;

      ctx.clearRect(0, 0, W, H);

      // Update nodes
      const nodes = nodesRef.current;
      nodes.forEach(n => {
        n.x += n.vx * spd;
        n.y += n.vy * spd;
        n.pulse += dt * 1.8 * spd;
        if(n.x < 0 || n.x > W) n.vx *= -1;
        if(n.y < 0 || n.y > H) n.vy *= -1;
        n.x = Math.max(0, Math.min(W, n.x));
        n.y = Math.max(0, Math.min(H, n.y));
      });

      // Draw connections
      const maxDist = Math.min(W, H) * 0.55;
      for(let i = 0; i < nodes.length; i++) {
        for(let j = i+1; j < nodes.length; j++) {
          const dx = nodes[i].x - nodes[j].x;
          const dy = nodes[i].y - nodes[j].y;
          const d = Math.sqrt(dx*dx + dy*dy);
          if(d < maxDist) {
            const a = (1 - d/maxDist) * 0.18;
            ctx.save();
            ctx.strokeStyle = `rgba(${col},${a})`;
            ctx.lineWidth = 0.8;
            ctx.beginPath();
            ctx.moveTo(nodes[i].x, nodes[i].y);
            ctx.lineTo(nodes[j].x, nodes[j].y);
            ctx.stroke();
            ctx.restore();
          }
        }
      }

      // Draw nodes
      nodes.forEach(n => {
        const pulse = 0.4 + Math.sin(n.pulse) * 0.35;
        ctx.save();
        ctx.shadowColor = `rgb(${col})`;
        ctx.shadowBlur = 6 * pulse;
        ctx.fillStyle = `rgba(${col},${pulse * 0.9})`;
        ctx.beginPath();
        ctx.arc(n.x, n.y, n.r * (0.8 + Math.sin(n.pulse) * 0.2), 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });

      // Center label
      ctx.save();
      ctx.fillStyle = `rgba(${col},0.15)`;
      ctx.font = "700 11px 'Fira Code', monospace";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("NEURAL · NETWORK", W/2, H/2);
      ctx.restore();
    };

    animate(performance.now());
    return () => { cancelAnimationFrame(rafRef.current); ro.disconnect(); };
  }, [active, animState]);

  return (
    <canvas ref={canvasRef} style={{position:"absolute",inset:0,width:"100%",height:"100%"}}/>
  );
}

// ── File Dropzone ─────────────────────────────────────────────────────────────
function FileDropzone({onLog,active}){
  const[over,setOver]=useState(false);const[files,setFiles]=useState([]);const inp=useRef(null);
  const upload=async file=>{
    const fd=new FormData();fd.append("file",file);
    try{
      const r=await fetch(`${API}/api/upload`,{method:"POST",body:fd});
      const d=await r.json();
      if(d.filename){setFiles(f=>[{name:d.filename,size:d.size,t:nowTs()},...f].slice(0,5));onLog?.(`Uploaded: ${d.filename}`,"#3ddc97")}
    }catch(e){onLog?.(`Upload error: ${e.message}`,"#ff5a6a")}
  };
  const onDrop=async e=>{e.preventDefault();setOver(false);for(const f of e.dataTransfer.files)await upload(f)};
  return(
    <div className="glass" style={{overflow:"hidden"}}>
      <div className="phdr"><span className="ptitle">File · Drop</span><span className="muted mono t9">{active}</span></div>
      <div style={{padding:"9px 10px"}}>
        <div className={`dz${over?" ov":""}`} onDrop={onDrop} onDragOver={e=>{e.preventDefault();setOver(true)}} onDragLeave={()=>setOver(false)} onClick={()=>inp.current?.click()}>
          <span className="dz-icon">⊕</span>Drop files or click to upload
        </div>
        <input ref={inp} type="file" multiple style={{display:"none"}} onChange={e=>{for(const f of e.target.files)upload(f)}}/>
        {files.map((f,i)=>(
          <div key={i} className="f ac gap4" style={{padding:"3px 0",borderBottom:"1px solid rgba(255,255,255,0.03)"}}>

          </div>
        ))}
      </div>
    </div>
  );
}

// ── Terminal Pane ─────────────────────────────────────────────────────────────
const TCFG={
  fontFamily:"'Fira Code','Cascadia Code',monospace",
  fontSize:13,lineHeight:1.4,cursorBlink:true,cursorStyle:"bar",scrollback:3000,
  allowTransparency:true,
  theme:{
    background:"rgba(3,5,9,0.72)",foreground:"#e2eaf8",cursor:"#e09d55",cursorAccent:"#04060a",
    selectionBackground:"rgba(90,184,255,0.22)",
    black:"#0d1117",red:"#ff5a6a",green:"#3ddc97",yellow:"#f0c040",
    blue:"#5ab8ff",magenta:"#b88de8",cyan:"#5ee7d0",white:"#e2eaf8",
    brightBlack:"#3a4a60",brightRed:"#ff7a87",brightGreen:"#6effc2",brightYellow:"#ffdf80",
    brightBlue:"#85c2ff",brightMagenta:"#c4a2f2",brightCyan:"#85f0e0",brightWhite:"#f0f5ff",
  },
};

function TerminalPane({model,visible,wsObj,bcRef,onTextReady,onMsg,onReady,onUserInput,onUserSend}){
  const cRef=useRef(null);
  const tRef=useRef(null);
  const fRef=useRef(null);
  const init=useRef(false);
  const inputBuf=useRef("");
  const onUserInputRef=useRef(onUserInput);
  const onUserSendRef=useRef(onUserSend);
  useEffect(()=>{onUserInputRef.current=onUserInput},[onUserInput]);
  useEffect(()=>{onUserSendRef.current=onUserSend},[onUserSend]);

  useEffect(()=>{
    if(init.current||!cRef.current)return;
    init.current=true;
    const term=new Terminal(TCFG);
    const fit=new FitAddon.FitAddon();
    term.loadAddon(fit);term.open(cRef.current);fit.fit();
    tRef.current=term;fRef.current=fit;

    // Fix paste: intercept Ctrl+V and read browser clipboard directly.
    // Claude Code captures ^V (Ctrl+V) at PTY level for its own clipboard system,
    // which doesn't have access to browser clipboard. This sends clipboard text directly.
    term.attachCustomKeyEventHandler((e)=>{
      if((e.ctrlKey||e.metaKey)&&e.key==='v'&&e.type==='keydown'){
        navigator.clipboard.readText().then(text=>{
          if(!text)return;
          const ws=wsObj.current;
          if(ws&&ws.readyState===1)ws.send('\x1b[200~'+text+'\x1b[201~');
        }).catch(()=>{});
        return false;
      }
      return true;
    });

    onTextReady?.(model,()=>{
      const lines=[];
      for(let i=0;i<term.buffer.active.length;i++)lines.push(term.buffer.active.getLine(i)?.translateToString(true)||"");
      return lines.join("\n");
    });
    const connect=()=>{
      const ws=new WebSocket(`${WS_BASE}/ws/pty/${model}`);
      wsObj.current=ws;
      ws.onopen=()=>{ws.send(JSON.stringify({type:"resize",cols:term.cols,rows:term.rows}));onReady?.()};
      ws.onmessage=e=>term.write(e.data);
      ws.onerror=()=>{};
      ws.onclose=()=>setTimeout(connect,3000);
    };
    connect();
    term.onData(d=>{
      const ws=wsObj.current;
      if(ws&&ws.readyState===1){
        ws.send(d);
        if(bcRef?.current)bcRef.current(d,model);
        if(d==="\r"){
          // Only count as a message if user actually typed something (not empty Enter)
          const hasContent=inputBuf.current.trim().length>0;
          inputBuf.current="";
          if(model==="claude"&&hasContent)fetch(`${API}/api/claude-usage/increment`,{method:"POST"}).catch(()=>{});
          onMsg?.();onUserSendRef.current?.();
        }else{
          if(d==="\x7f"||d==="\b"){inputBuf.current=inputBuf.current.slice(0,-1);}
          else if(d.length===1&&d.charCodeAt(0)>=32){inputBuf.current+=d;}
          onUserInputRef.current?.();
        }
      }
    });
    const ro=new ResizeObserver(()=>{
      try{fit.fit()}catch{}
      const ws=wsObj.current;
      if(ws&&ws.readyState===1)ws.send(JSON.stringify({type:"resize",cols:term.cols,rows:term.rows}));
    });
    ro.observe(cRef.current);
    return()=>{ro.disconnect();try{term.dispose()}catch{}};
  },[]);

  useEffect(()=>{
    if(visible&&fRef.current)setTimeout(()=>{try{fRef.current.fit()}catch{}},55);
  },[visible]);

  return<div ref={cRef} className={`xw${visible?" vis":""}`}/>;
}

// ── Terminal Hub ──────────────────────────────────────────────────────────────
function TerminalHub({counts,termRefs,onMsg,active,setActive,onLog,onUserInput,onUserSend}){
  const[bc,setBc]=useState(false);
  const wsObjs=useRef({claude:{current:null},gemini:{current:null},kimi:{current:null}});
  const bcRef=useRef(null);
  const textGetters=useRef({});

  useEffect(()=>{
    if(bc){
      bcRef.current=(data,srcModel)=>{
        MODELS.forEach(m=>{if(m!==srcModel){const ws=wsObjs.current[m]?.current;if(ws&&ws.readyState===1)ws.send(data)}});
      };
    }else{bcRef.current=null}
  },[bc]);

  useEffect(()=>{
    MODELS.forEach(m=>{
      termRefs.current[m]={wsRef:wsObjs.current[m],getText:()=>textGetters.current[m]?.()||""};
    });
  });

  const onTextReady=useCallback((model,getter)=>{textGetters.current[model]=getter},[]);
  const aiClass=m=>m==="claude"?"cl":m==="gemini"?"gm":"km";

  return(
    <div className="glass" style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden"}}>
      <div className="term-tabs">
        {MODELS.map(m=>(
          <button key={m} className={`t-tab${active===m?` active ${aiClass(m)}`:""}`} onClick={()=>setActive(m)}>
            <span style={{marginRight:5,fontSize:9}}>●</span>{m.charAt(0).toUpperCase()+m.slice(1)}
            {counts[m]>0&&(
              <span style={{marginLeft:5,fontSize:9.5,padding:"1px 5px",borderRadius:10,background:`${CLR[m]}22`,color:CLR[m],fontFamily:"var(--f-mono)"}}>
                {counts[m]}
              </span>
            )}
          </button>
        ))}
        <button
          className={`bc-btn${bc?" on":""}`}
          onClick={()=>setBc(b=>!b)}
          title="Broadcast Mode: sends your keystrokes to ALL 3 terminals simultaneously. Useful for running the same command on Claude, Gemini and Kimi at the same time."
        >
          {bc?"⚡ Broadcast ON":"Broadcast"}
        </button>
      </div>
      {bc && (
        <div style={{padding:"3px 10px",background:"rgba(240,192,64,0.08)",borderBottom:"1px solid rgba(240,192,64,0.2)",fontFamily:"var(--f-mono)",fontSize:"10px",color:"var(--yellow)"}}>
          ⚡ Broadcast Mode: Her tuş 3 terminale aynı anda gönderiliyor
        </div>
      )}
      <div className="term-body">
        <VaultHoloAnimation activeModel={active} animState={termRefs._animState||"idle"}/>
        {MODELS.map(m=>(
          <TerminalPane key={m} model={m} visible={active===m}
            wsObj={wsObjs.current[m]} bcRef={bcRef}
            onTextReady={onTextReady}
            onMsg={()=>onMsg(m)}
            onReady={()=>onLog?.(`${m} terminal ready`,CLR[m])}
            onUserInput={onUserInput}
            onUserSend={onUserSend}/>
        ))}
      </div>
    </div>
  );
}

        <span className="up-badge" style={{color:"#3ddc97",marginRight:4}}>↑ {metrics.uptime||"00:00"}</span>
        <LiveClock/>
        <span className="muted mono t9" style={{letterSpacing:"0.1em",marginLeft:6,marginRight:6}}>
          <span style={{color:CLR[active],textShadow:`0 0 8px ${CLR[active]}`}}>● {active.toUpperCase()}</span>
        </span>
        <button className="icon-btn" onClick={shutdown} style={{color:"#ff5a6a",borderColor:"rgba(255,90,106,0.3)"}} title="Shutdown backend">⏻</button>
      </header>

      <main className="app-main">
        <aside className="panel-l">
          <UsageDashboard/>
          <ContextBridge counts={counts} termRefs={termRefs} onLog={addLog} onSwitch={handleSwitch}/>
          <SysMonitor m={metrics}/>
        </aside>

        <div className="panel-c">
          <TerminalHub counts={counts} termRefs={termRefs} onMsg={onMsg}
            active={active} setActive={handleSwitch} onLog={addLog}
            onUserInput={handleUserInput} onUserSend={handleUserSend}/>
        </div>

        <aside className="panel-r">
          <PromptOptimizer onLog={addLog}/>
          <NeuralPanel active={active} animState={animState}/>
          <CouncilPanel onLog={addLog}/>
          <ActivityLog entries={logs}/>
          <FileDropzone onLog={addLog} active={active}/>
        </aside>
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
